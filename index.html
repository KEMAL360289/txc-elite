<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXC ELITE | Giyim</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: white;
    }

    header {
      padding: 25px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #111, #050505);
    }

    .hero h1 {
      font-size: clamp(55px, 12vw, 130px);
      letter-spacing: 10px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 15px 35px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 3px;
    }

    .products {
      padding: 70px 8%;
      text-align: center;
    }

    .products h2 {
      font-size: 35px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      background: #111;
      padding: 30px 20px;
      border: 1px solid #222;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #555;
    }

    .product-image {
      height: 260px;
      background: #1b1b1b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #aaa;
      margin-bottom: 20px;
    }

    footer {
      padding: 40px;
      text-align: center;
      border-top: 1px solid #222;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TXC ELITE</div>

    <nav>
      <a href="#">Ana Sayfa</a>
      <a href="#urunler">Ürünler</a>
      <a href="#iletisim">İletişim</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h1>TXC</h1>
      <p>ELITE GİYİM • PREMIUM STYLE</p>
      <a href="#urunler" class="button">ÜRÜNLERİ KEŞFET</a>
    </div>
  </section>

  <section class="products" id="urunler">
    <h2>TXC ELITE</h2>

    <div class="grid">

      <div class="card">
        <div class="product-image">T-SHIRT</div>
        <h3>TXC Elite T-Shirt</h3>
        <p class="price">₺899</p>
        <a href="#" class="button">İNCELE</a>
      </div>

      <div class="card">
        <div class="product-image">HOODIE</div>
        <h3>TXC Elite Hoodie</h3>
        <p class="price">₺1.499</p>
        <a href="#" class="button">İNCELE</a>
      </div>

      <div class="card">
        <div class="product-image">PANT</div>
        <h3>TXC Elite Pantolon</h3>
        <p class="price">₺1.299</p>
        <a href="#" class="button">İNCELE</a>
      </div>

      <div class="card">
        <div class="product-image">BAG</div>
        <h3>TXC Elite Çanta</h3>
        <p class="price">₺1.199</p>
        <a href="#" class="button">İNCELE</a>
      </div>

    </div>
  </section>

  <footer id="iletisim">
    © 2026 TXC ELITE — All Rights Reserved
  </footer>

</body>
</html>
